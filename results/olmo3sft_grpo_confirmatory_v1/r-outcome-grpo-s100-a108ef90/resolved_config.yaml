  vllm_batch_invariant: true
  training_backend: torch_peft
  dummy: null
training:
  method: grpo
  adapter: lora
  logical_batch_items: 32
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  updates: 40
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_steps: 5
  lr_schedule: constant_with_warmup
  max_grad_norm: 1.0
  max_target_tokens: 512
  gradient_checkpointing: true
  max_consecutive_no_gradient_updates: 5
  lora:
    rank: 16
    alpha: 32.0
    dropout: 0.05
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
grpo:
  group_size: 8
  temperature: 1.0
  max_completion_tokens: 512
  kl_coefficient: 0.05
  normalize_advantage_std: false
  normalize_by_length: false
  reward_correct: 1.0
  reward_wrong: 0.0
  reward_unparseable: -0.1
tracker:
  theta_initial: 1.0
  variance_initial: 2.0
  process_variance: 0.05
  probability_clip: 1.0e-06
  variance_floor: 1.0e-08
  include_item_uncertainty: false
  noise_after_noop_update: false
schedule:
  type: rotating_round_robin
  skills:
  - craft_structure.words_in_context
  - craft_structure.text_structure
  - craft_structure.cross_text_connections
  - information_ideas.central_ideas
  - information_ideas.command_of_evidence_textual
  - information_ideas.inferences
  - expression_of_ideas.rhetorical_synthesis
  - expression_of_ideas.transitions
  - standard_english.boundaries
  - standard_english.form_structure_sense
selection:
  policy: r
  target_success_probability: 0.5
  target_band_half_width: 0.15
  candidate_slate_size: 16
  ppu_quadrature_nodes: 64
  tie_tolerance: 1.0e-12
  label_initial: 3
  pt:
    estimator: fixed_rollouts
    rollouts_per_candidate: 4
    temperature: 1.0
    sequential_increment: null
    sequential_half_width: null
    maximum_rollouts: null
    max_completion_tokens: 512
