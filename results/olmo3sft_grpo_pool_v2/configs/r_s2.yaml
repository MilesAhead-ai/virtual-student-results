budget:
  compute_gpu_hours: 0
  paid_api_usd: 0
data:
  source: sat_platform
  source_root: ../sat-reading-platform
  bank_split: w
  split_assignment: file
  split_fractions:
    p: 1.0
  split_file: data/splits/pool_v2_dev.json
  split_quotas:
    e1: 60
    d: 20
    s: 160
    p_plus: 64
  split_remainder: p
  pool_question_files:
  - data/raw/pool_v1/P1/balanced/P1_boundaries.jsonl
  - data/raw/pool_v1/P1/balanced/P1_central_ideas.jsonl
  - data/raw/pool_v1/P1/balanced/P1_command_of_evidence_textual.jsonl
  - data/raw/pool_v1/P1/balanced/P1_cross_text_connections.jsonl
  - data/raw/pool_v1/P1/balanced/P1_form_structure_sense.jsonl
  - data/raw/pool_v1/P1/balanced/P1_inferences.jsonl
  - data/raw/pool_v1/P1/balanced/P1_rhetorical_synthesis.jsonl
  - data/raw/pool_v1/P1/balanced/P1_text_structure.jsonl
  - data/raw/pool_v1/P1/balanced/P1_transitions.jsonl
  - data/raw/pool_v1/P1/balanced/P1_words_in_context.jsonl
  - data/raw/pool_v1/P2/balanced/P2_boundaries.jsonl
  - data/raw/pool_v1/P2/balanced/P2_central_ideas.jsonl
  - data/raw/pool_v1/P2/balanced/P2_command_of_evidence_textual.jsonl
  - data/raw/pool_v1/P2/balanced/P2_cross_text_connections.jsonl
  - data/raw/pool_v1/P2/balanced/P2_form_structure_sense.jsonl
  - data/raw/pool_v1/P2/balanced/P2_inferences.jsonl
  - data/raw/pool_v1/P2/balanced/P2_rhetorical_synthesis.jsonl
  - data/raw/pool_v1/P2/balanced/P2_text_structure.jsonl
  - data/raw/pool_v1/P2/balanced/P2_transitions.jsonl
  - data/raw/pool_v1/P2/balanced/P2_words_in_context.jsonl
  - data/raw/pool_v1/P3/survivors.jsonl
  - data/raw/pool_v1/P4/survivors.jsonl
  - data/raw/pool_v1/P5/survivors.jsonl
  - data/raw/pool_v2/H1pilot/pilot_all.jsonl
  - data/raw/pool_v2/H2topup/topup_all.jsonl
  drop_key_flagged: true
  panel_runs:
  - bank_eval_dirs:
    - data/raw/pool_v1/gpu_W/eval
    - data/raw/pool_v2/api_r1/W
    pool_eval_dirs:
    - data/raw/pool_v1/P1/eval
    - data/raw/pool_v1/P2/eval_r1
    - data/raw/pool_v1/P3/eval_r1
    - data/raw/pool_v1/P4/eval_r1
    - data/raw/pool_v1/P5/eval_r1
    - data/raw/pool_v2/H1pilot/eval_r1
    - data/raw/pool_v2/H2topup/eval_r1
    - data/raw/pool_v2/api_r1/pool_v1
    - data/raw/pool_v2/api_r1/pilot
    - data/raw/pool_v2/api_r1/topup
  - bank_eval_dirs:
    - data/raw/pool_v1/repeat_r2/eval
    pool_eval_dirs:
    - data/raw/pool_v1/P2/eval_r2
    - data/raw/pool_v1/P3/eval_r2
    - data/raw/pool_v1/P4/eval_r2
    - data/raw/pool_v1/P5/eval_r2
    - data/raw/pool_v2/H1pilot/eval_r2
    - data/raw/pool_v2/H2topup/eval_r2
  - bank_eval_dirs:
    - data/raw/pool_v1/repeat_r3/eval
    pool_eval_dirs:
    - data/raw/pool_v1/P2/eval_r3
    - data/raw/pool_v1/P3/eval_r3
    - data/raw/pool_v1/P4/eval_r3
    - data/raw/pool_v1/P5/eval_r3
    - data/raw/pool_v2/H1pilot/eval_r3
    - data/raw/pool_v2/H2topup/eval_r3
  licenses:
    college_board_practice_test_unverified: development_use_only
    internal_generated: development_use_only
  e3_license_decision: REQUIRED
  dedup:
    embedding_model: REQUIRED
    embedding_revision: REQUIRED
    embedding_threshold: REQUIRED
development_only:
- training
- grpo
- training.updates
- training.max_consecutive_no_gradient_updates
- tracker.process_variance
- selection.candidate_slate_size
- selection.pt
- feedback.sibling_map_version
- panel.repeat_weighting
- feedback.sibling_difficulty_tolerance
- feedback.sibling_check_context
- feedback.resolve_temperature
- feedback.dialogue_temperature
- feedback.f2_token_target
- tutor
- judges
- evaluation
- panel
- data.split_assignment
- data.split_quotas
- data.licenses
- budget
evaluation:
  dense_sets:
  - s
  - d
  every_updates: 5
  primary_set: s
  sparse_sets: []
  sparse_updates: []
  answer_parser: answer-line-v2
experiment:
  cache_root: artifacts/cache
  calibration_id: pool-v2-wp
  data_root: data/processed/pool_v2_wp
  experiment_id: olmo3sft_grpo_pool_v2
  f3_library_file: data/processed/pool_v2_wp/f3_library.jsonl
  lock_file: data/locks/pool_v2_wp/splits_v1.json
  mode: development
  output_root: artifacts
  root_seed: 2
  sibling_map_file: data/processed/pool_v2_wp/sibling_map.parquet
  stage: m0
feedback:
  condition: outcome
  dialogue_temperature: 0.0
  f2_token_target: 150
  resolve_temperature: 1.0
  sibling_check_context: in_dialogue
  sibling_difficulty_tolerance: 0.75
  sibling_map_version: pool-v1-dev
grpo:
  group_size: 8
  kl_coefficient: 0.05
  max_completion_tokens: 512
  temperature: 1.0
judges:
  adaptation: &id001
    maximum_output_tokens: 1024
    model_id: dummy-tutor
    model_revision: dummy-v1
    provider: dummy
  classifier: *id001
  leakage: *id001
  standalone: *id001
panel:
  calibration_splits:
  - w
  - p
  - p_plus
  probe_splits:
  - d
  - s
  - e1
  theta_prior_mean: 0.0
  theta_prior_variance: 2.0
  difficulty_prior_mean: 0.0
  difficulty_prior_variance: 2.0
  repeat_weighting: mean
  max_iterations: 500
schedule:
  skills:
  - craft_structure.words_in_context
  - craft_structure.text_structure
  - craft_structure.cross_text_connections
  - information_ideas.central_ideas
  - information_ideas.command_of_evidence_textual
  - information_ideas.inferences
  - expression_of_ideas.rhetorical_synthesis
  - expression_of_ideas.transitions
  - standard_english.boundaries
  - standard_english.form_structure_sense
  type: rotating_round_robin
schema_version: 1
selection:
  candidate_slate_size: 16
  policy: r
  pt:
    estimator: fixed_rollouts
    max_completion_tokens: 512
    rollouts_per_candidate: 4
    temperature: 1.0
    tracker_difficulty_rule: panelprobe
statistics:
  contrast_families:
    S:
    - pp
    - pt
  equivalence_margin_aulc: 0.01
  minimum_effect_aulc: 0.02
  primary_metric: final_accuracy
  reference_condition: outcome
student:
  chat_template_hash: edbb35ef1219ad2273f716feed08f535a868e167be5b5518adc37ab2bcb8afe6
  dtype: bfloat16
  generation_backend: vllm
  generation_batch_size: 32
  max_context_tokens: 4096
  model_id: allenai/Olmo-3-7B-Instruct-SFT
  revision: e1452fc572d51966ff4aaeb25118b891eb93e549
  training_backend: torch_peft
  vllm_batch_invariant: true
  vllm_url: http://127.0.0.1:8100
tracker:
  process_variance: 0.05
  theta_initial: 1.0
training:
  adapter: lora
  gradient_accumulation_steps: 32
  gradient_checkpointing: true
  learning_rate: 0.0002
  logical_batch_items: 32
  lora:
    alpha: 32
    dropout: 0.05
    rank: 16
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lr_schedule: constant_with_warmup
  max_consecutive_no_gradient_updates: 5
  max_grad_norm: 1.0
  max_target_tokens: 512
  method: grpo
  micro_batch_size: 1
  updates: 100
  warmup_steps: 5
  weight_decay: 0.0
tutor: *id001
